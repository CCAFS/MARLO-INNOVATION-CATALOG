events {}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server {
        listen 80;
        root /usr/share/nginx/html;
        index index.html;

        location = /innovation/ {
            return 301 /;
        }

        location / {
            try_files $uri $uri/ $uri.html /index.html;
        }
    }
}
